# [추후 도메인 도입 시 사용 — 현재 미설치]
# 지금은 LAN IP 직결(frontend :8082, MinIO :9000)로 운영 중.
# 도메인을 만들면: 아래 server_name 교체 + devops/.env의 S3_PUBLIC_ENDPOINT를
# http://<도메인>으로, CORS_ALLOWED_ORIGINS를 http://<도메인>으로 바꾸고 재기동.
#
# 설치: sudo cp nginx-rallytrack.conf /etc/nginx/sites-available/rallytrack
#       sudo ln -s /etc/nginx/sites-available/rallytrack /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# 기존 kisa-app vhost는 건드리지 않음 (server_name으로 분리)

server {
    listen 80;
    listen [::]:80;

    server_name rallytrack-junmin.freedynamicdns.org;   # 실제 생성한 DDNS 호스트네임으로 교체

    # 영상 업로드 최대 크기 (backend/컨테이너 nginx 설정과 맞춤)
    client_max_body_size 2g;

    # SPA + /api → frontend 컨테이너 (내부에서 /api를 backend로 재프록시)
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # 대용량 업로드 스트리밍
    }

    # MinIO presigned URL (path-style: /<bucket>/<key>?X-Amz-...)
    # Host 헤더를 보존해야 presigned 서명이 일치한다.
    location /rallytrack-videos/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;           # 영상 스트리밍/Range 요청
        proxy_request_buffering off;   # AI 서버의 presigned PUT 업로드
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
