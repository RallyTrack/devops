
services:
  # 1. MySQL 데이터베이스
  db:
    image: mysql:8.0
    container_name: rally-mysql
    ports:
      - "3307:3306"  # (내 컴퓨터 포트):(도커 내부 포트)
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rallytrack
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

  # 2. Backend (Spring Boot)
  backend:
    build: ../backend  # devops 폴더 기준 상위 폴더의 backend 참조
    container_name: rally-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - rally-network
    restart: on-failure

  # 3. Frontend (React)
  frontend:
    build: ../frontend # devops 폴더 기준 상위 폴더의 frontend 참조
    container_name: rally-frontend
    ports:
      - "3000:80"  # 호스트 3000번 포트로 들어오면 컨테이너 80번(Nginx)으로 연결
    depends_on:
      - backend
    networks:
      - rally-network

  # 4. AI Server
  ai-server:
    build: ../aiAnalysis-server
    container_name: rally-ai
    ports:
      - "8000:8000"
    networks:
      - rally-network

volumes:
  db_data:

networks:
  rally-network:
    driver: bridge
